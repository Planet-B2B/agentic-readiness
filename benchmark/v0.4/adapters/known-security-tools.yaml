id: known-security-tools
benchmark_version: 0.4.0
extensions:
  - control_id: ADRB-SEC-003
    evidence_index: 0
    ci_tools:
      - id: gitleaks
        commands:
          - executables: [gitleaks]
            required_arguments: [detect, protect]
        actions: [gitleaks/gitleaks-action]
      - id: trufflehog
        commands:
          - executables: [trufflehog]
            required_arguments: [git, filesystem]
        actions: [trufflesecurity/trufflehog]
      - id: detect-secrets
        commands:
          - executables: [detect-secrets]
            required_arguments: [scan]
        actions: [Yelp/detect-secrets-action]
      - id: git-secrets
        commands:
          - executables: [git-secrets]
            required_arguments: [--scan, --scan-history]
