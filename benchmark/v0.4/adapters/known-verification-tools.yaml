id: known-verification-tools
benchmark_version: 0.4.0
extensions:
  - control_id: ADRB-TST-003
    evidence_index: 0
    ci_tools:
      - id: tests
        commands:
          - executables: [npm, pnpm, yarn, bun, turbo, nx]
            required_arguments:
              [test, test:unit, test:integration, test:e2e, unit-test, integration-test, e2e]
          - executables: [cargo, go, dotnet, mvn, mvnw, gradle, gradlew, bazel]
            required_arguments: [test]
        standalone_executables: [pytest, pytest-cov, jest, vitest, tox, nox]
      - id: static-analysis
        commands:
          - executables: [npm, pnpm, yarn, bun, turbo, nx]
            required_arguments: [lint, typecheck, type-check, check:types, check-types, check]
          - executables: [cargo]
            required_arguments: [clippy, check]
          - executables: [go]
            required_arguments: [vet]
          - executables: [mvn, mvnw]
            required_arguments: [checkstyle:check, spotbugs:check, pmd:check]
          - executables: [gradle, gradlew]
            required_arguments: [check]
          - executables: [ruff]
            required_arguments: [check]
        standalone_executables: [eslint, tsc, mypy, flake8, pyright, golangci-lint]
