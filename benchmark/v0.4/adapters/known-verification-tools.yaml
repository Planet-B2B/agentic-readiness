id: known-verification-tools
benchmark_version: 0.4.0
extensions:
  - control_id: ADRB-TST-003
    evidence_index: 0
    ci_tools:
      - id: tests
        executables:
          [
            npm,
            pnpm,
            yarn,
            bun,
            cargo,
            go,
            dotnet,
            mvn,
            mvnw,
            gradle,
            gradlew,
            make,
            turbo,
            nx,
            bazel,
          ]
        required_arguments:
          [test, test:unit, test:integration, test:e2e, unit-test, integration-test, e2e]
        standalone_executables: [pytest, pytest-cov, jest, vitest, tox, nox]
      - id: static-analysis
        executables:
          [
            npm,
            pnpm,
            yarn,
            bun,
            cargo,
            go,
            dotnet,
            mvn,
            mvnw,
            gradle,
            gradlew,
            make,
            ruff,
            turbo,
            nx,
            bazel,
          ]
        required_arguments:
          [
            lint,
            typecheck,
            type-check,
            check:types,
            check-types,
            clippy,
            vet,
            checkstyle:check,
            spotbugs:check,
            pmd:check,
            check,
          ]
        standalone_executables: [eslint, tsc, mypy, flake8, pyright, golangci-lint]
