id: known-agent-harnesses
benchmark_version: 0.4.0
extensions:
  - control_id: ADRB-CTX-001
    evidence_index: 0
    patterns:
      [
        CLAUDE.md,
        .github/copilot-instructions.md,
        .claude/**,
        .codex/**,
        .cursor/rules/**,
        .cursor/agents/**,
        .cursor/skills/**,
        .opencode/**,
      ]
  - control_id: ADRB-CTX-002
    evidence_index: 0
    files:
      [
        CLAUDE.md,
        .github/copilot-instructions.md,
        .claude/**/*.md,
        .codex/**/*.md,
        .cursor/rules/**/*.md,
        .cursor/agents/**/*.md,
        .opencode/**/*.md,
      ]
  - control_id: ADRB-CTX-003
    evidence_index: 0
    ci_tools:
      - id: agent-guidance-validation
        executables: [npm, pnpm, yarn, bun, make, node, tsx]
        required_arguments:
          [
            agent-doc-check,
            agent-docs-check,
            check-agent-docs,
            check:agent-docs,
            lint-agent-docs,
            lint:agent-docs,
            validate-agent-docs,
            validate:agent-docs,
            scripts/check-agent-docs.js,
            scripts/check-agent-docs.ts,
            scripts/validate-agent-docs.js,
            scripts/validate-agent-docs.ts,
          ]
        standalone_executables:
          [agent-doc-check, check-agent-docs, lint-agent-docs, validate-agent-docs]
  - control_id: ADRB-ENV-001
    evidence_index: 0
    files:
      [
        CLAUDE.md,
        .claude/**/*.md,
        .codex/**/*.md,
        .cursor/agents/**/*.md,
        .cursor/rules/**/*.md,
        .cursor/skills/**/*.md,
        .opencode/**/*.md,
      ]
  - control_id: ADRB-SPC-001
    evidence_index: 0
    patterns: [.kiro/specs/**, .cursor/plans/**, .codex/plans/**]
  - control_id: ADRB-SPC-002
    evidence_index: 0
    files: [.kiro/specs/**, .cursor/plans/**, .codex/plans/**]
