id: known-agent-harnesses
benchmark_version: 0.4.0
extensions:
  - control_id: ADRB-CTX-001
    evidence_index: 0
    patterns:
      [
        CLAUDE.md,
        .github/copilot-instructions.md,
        .claude/**,
        .codex/**,
        .cursor/rules/**,
        .cursor/agents/**,
        .cursor/skills/**,
        .opencode/**,
      ]
  - control_id: ADRB-CTX-002
    evidence_index: 0
    files:
      [
        CLAUDE.md,
        .github/copilot-instructions.md,
        .claude/**/*.md,
        .codex/**/*.md,
        .cursor/rules/**/*.md,
        .cursor/agents/**/*.md,
        .opencode/**/*.md,
      ]
  - control_id: ADRB-CTX-003
    evidence_index: 0
    ci_tools:
      - id: agent-guidance-validation
        commands:
          - executables: [node, tsx]
            argument_groups:
              - [
                  scripts/check-agent-docs.js,
                  scripts/check-agent-docs.ts,
                  scripts/validate-agent-docs.js,
                  scripts/validate-agent-docs.ts,
                ]
            source_content_groups:
              - [agents.md, agent guidance, agent instructions]
              - [readfilesync, readfile, read file]
              - [throw new error, process.exit(1, process.exitcode = 1]
          - executables: [bash, sh]
            argument_groups:
              - [scripts/check-agent-docs.sh, scripts/validate-agent-docs.sh]
            source_content_groups:
              - [agents.md, agent guidance, agent instructions]
              - [grep, test -]
              - [exit 1, return 1, test -]
          - executables: [python, python3]
            argument_groups:
              - [scripts/check_agent_docs.py, scripts/validate_agent_docs.py]
            source_content_groups:
              - [agents.md, agent guidance, agent instructions]
              - [read_text, read text, open(]
              - [raise, sys.exit(1]
