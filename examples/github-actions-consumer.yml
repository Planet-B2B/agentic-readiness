name: Agentic readiness baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: readiness
        uses: Planet-B2B/agentic-readiness@v0.2.0
        with:
          profile: pr-creation
          report: .agentic/agentic-readiness.json
          enforce: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentic-readiness
          path: .agentic/agentic-readiness.json
      - run: |
          echo "Score: ${{ steps.readiness.outputs.score }}/40" >> "$GITHUB_STEP_SUMMARY"
          echo "Target passed: ${{ steps.readiness.outputs.target_passed }}" >> "$GITHUB_STEP_SUMMARY"
