name: Agentic readiness baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: readiness
        uses: Planet-B2B/agentic-readiness@v0.4.0
        with:
          profile: pr-creation
          report: .agentic/agentic-readiness.json
          enforce: false
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agentic-readiness
          path: .agentic/agentic-readiness.json
      - run: |
          echo "Score: ${{ steps.readiness.outputs.score }}/40" >> "$GITHUB_STEP_SUMMARY"
          echo "Repository-detected: ${{ steps.readiness.outputs.repository_score }}/${{ steps.readiness.outputs.repository_ceiling }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Target passed: ${{ steps.readiness.outputs.target_passed }}" >> "$GITHUB_STEP_SUMMARY"
