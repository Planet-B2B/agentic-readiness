name: Agentic Development Readiness
description: Assess a repository against a versioned agentic-development readiness profile
author: Agentic Readiness contributors
branding:
  icon: check-circle
  color: blue
inputs:
  path:
    description: Repository path to assess
    default: .
  profile:
    description: Target readiness profile
    default: pr-creation
  report:
    description: JSON report path
    default: .agentic/report.json
  scope:
    description: Evidence path scope (tracked or workspace)
    default: tracked
  agent_evidence:
    description: Optional agent-collected evidence bundle
    required: false
  enforce:
    description: Fail when the target profile is not met
    default: 'false'
outputs:
  score:
    description: Overall score out of 40
    value: ${{ steps.assess.outputs.score }}
  percentage:
    description: Display percentage
    value: ${{ steps.assess.outputs.percentage }}
  repository_score:
    description: Consecutive maturity established by deterministic repository evidence
    value: ${{ steps.assess.outputs.repository_score }}
  repository_ceiling:
    description: Maximum consecutive maturity the offline repository collector can establish
    value: ${{ steps.assess.outputs.repository_ceiling }}
  repository_percentage:
    description: Repository-detected progress against the offline ceiling
    value: ${{ steps.assess.outputs.repository_percentage }}
  highest_profile:
    description: Highest passed profile
    value: ${{ steps.assess.outputs.highest_profile }}
  target_passed:
    description: Whether the requested profile passed
    value: ${{ steps.assess.outputs.target_passed }}
  report_path:
    description: Generated JSON report path
    value: ${{ steps.assess.outputs.report_path }}
runs:
  using: composite
  steps:
    - id: assess
      shell: bash
      env:
        ADRB_PATH: ${{ inputs.path }}
        ADRB_PROFILE: ${{ inputs.profile }}
        ADRB_REPORT: ${{ inputs.report }}
        ADRB_SCOPE: ${{ inputs.scope }}
        ADRB_AGENT_EVIDENCE: ${{ inputs.agent_evidence }}
        ADRB_ENFORCE: ${{ inputs.enforce }}
      run: |
        args=(assess "$ADRB_PATH" --profile "$ADRB_PROFILE" --scope "$ADRB_SCOPE" --format json --output "$ADRB_REPORT" --github-output)
        if [[ -n "$ADRB_AGENT_EVIDENCE" ]]; then
          args+=(--agent-evidence "$ADRB_AGENT_EVIDENCE")
        fi
        if [[ "$ADRB_ENFORCE" == "true" ]]; then
          args+=(--enforce)
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
