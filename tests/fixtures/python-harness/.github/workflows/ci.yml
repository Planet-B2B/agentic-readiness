name: ci

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11.9'
      - run: uv sync --all-groups
      - run: uv run flake8 src tests
      - run: uv run mypy src
      - run: uv run pytest --cov=example
