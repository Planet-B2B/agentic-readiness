name: Verify
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: npm ci
      - run: npm run check
      - run: npm test && npm run typecheck && npm run lint
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      - name: Check acceptance criteria traceability
        run: npm run spec-check
      - name: Validate agent instructions
        run: npm run agent-doc-check
      - name: Run knowledge curation for stale and contradictory guidance
        run: npm run knowledge-curator
